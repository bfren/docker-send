name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  IMAGES: bfren/send quay.io/bfren/send

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tags.outputs.version }}
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      -
        name: Checkout code
        uses: actions/checkout@v7
      -
        name: Read versions and build tag list
        id: tags
        shell: bash
        run: |
          read_file() { tr -d '[:space:]' < "$1"; }
          version=$(read_file VERSION)
          major=$(read_file VERSION_MAJOR)
          minor=$(read_file VERSION_MINOR)
          send_major=$(read_file overlay/tmp/SEND_MAJOR)
          send_minor=$(read_file overlay/tmp/SEND_MINOR)
          send_revision=$(read_file overlay/tmp/SEND_REVISION)
          tags=(
            latest
            ${major}
            ${minor}
            ${version}
            send${send_major}
            send${send_major}-${version}
            send${send_minor}
            send${send_minor}-${version}
            send${send_revision}
          )
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "tags=${tags[*]}" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          -
            platform: linux/amd64
            runner: ubuntu-24.04
          -
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      -
        name: Checkout code
        uses: actions/checkout@v7
      -
        name: Get platform name
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
        shell: bash
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Login to Quay.io Container Registry
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.QUAY_TOKEN }}
      -
        name: Build and push by digest
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          build-args: |
            BF_IMAGE=${{ github.event.repository.name }}
            BF_PUBLISHING=1
            BF_VERSION=${{ needs.prepare.outputs.version }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=bfren/send,quay.io/bfren/send",push-by-digest=true,name-canonical=true,push=true
      -
        name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.docker_build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      -
        name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      -
        name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Login to Quay.io Container Registry
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.QUAY_TOKEN }}
      -
        name: Create multi-platform images and push
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          for image in ${IMAGES}; do
            tag_args=$(printf -- "-t ${image}:%s " ${TAGS})
            docker buildx imagetools create ${tag_args} $(printf "${image}@sha256:%s " *)
          done
        shell: bash
      -
        name: Inspect image
        run: docker buildx imagetools inspect bfren/send:${{ needs.prepare.outputs.version }}
