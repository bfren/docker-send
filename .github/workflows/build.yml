name: build

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    uses: bfren/docker/.github/workflows/build.yml@shared-build
    with:
      image: send
      platforms: |
        linux/amd64
        linux/arm64
      publish: ${{ github.event_name == 'release' }}
      tags: |
        latest
        ${VERSION_MAJOR}
        ${VERSION_MINOR}
        ${VERSION}
        send${SEND_MAJOR}
        send${SEND_MAJOR}-${VERSION}
        send${SEND_MINOR}
        send${SEND_MINOR}-${VERSION}
        send${SEND_REVISION}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
